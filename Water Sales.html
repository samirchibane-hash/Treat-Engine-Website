<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Sales — ClearDeals by Treat Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#faf7f2;
  --cream-mid:#f0ebe0;
  --cream-dark:#e5ddd0;
  --ink:#1c1814;
  --ink-mid:#3d3530;
  --ink-muted:#7a6f65;
  --navy:#1a2744;
  --navy-light:#243460;
  --gold:oklch(0.72 0.10 72);
  --gold-dark:oklch(0.58 0.12 68);
  --blue:#3b82f6;
  --blue-light:#eff6ff;
  --blue-dark:#1d4ed8;
  --white:#fffefb;
  --border:rgba(28,24,20,0.10);
  --border-mid:rgba(28,24,20,0.06);
}
html{scroll-behavior:smooth;scroll-padding-top:88px;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.12;}
p{line-height:1.75;}
a{text-decoration:none;color:inherit;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,247,242,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:box-shadow .3s;}
.nav.scrolled{box-shadow:0 2px 24px rgba(28,24,20,0.07);}
.nav-inner{max-width:1180px;margin:0 auto;padding:0 32px;height:70px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo img{height:34px;width:auto;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-links a{font-size:13.5px;font-weight:500;color:var(--ink-muted);padding:7px 14px;border-radius:6px;transition:all .2s;letter-spacing:.01em;}
.nav-links a:hover{color:var(--ink);background:var(--cream-mid);}
.nav-links a.active{color:var(--blue);font-weight:600;background:var(--blue-light);}
.nav-cta{background:var(--blue);color:#fff;border:none;padding:11px 22px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background .2s,transform .15s;font-family:'DM Sans',sans-serif;}
.nav-cta:hover{background:var(--blue-dark);transform:translateY(-1px);}
.nav-actions{display:flex;align-items:center;gap:10px;}
.nav-cta-ghost{color:var(--ink-mid);font-size:13.5px;font-weight:600;padding:11px 14px;border-radius:6px;transition:all .2s;white-space:nowrap;}
.nav-cta-ghost:hover{color:var(--ink);background:var(--cream-mid);}
@media(max-width:900px){.nav-links,.nav-cta,.nav-actions{display:none !important;}}

/* HERO */
.hero{padding:120px 32px 0;max-width:1280px;margin:0 auto;}
.hero-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:40px 0 72px;}
.hero-left{position:relative;z-index:2;max-width:760px;margin:0 auto;}
.service-badge{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;padding:7px 16px;border-radius:100px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px;}
.service-badge-dot{width:6px;height:6px;border-radius:50%;background:#fff;}
.hero h1{font-size:clamp(42px,5vw,72px);font-weight:600;color:var(--ink);margin-bottom:28px;letter-spacing:-.028em;line-height:1.04;}
.hero h1 em{font-style:italic;color:var(--navy);}
.hero-sub{font-size:17.5px;color:var(--ink-muted);max-width:560px;margin:0 auto 36px;line-height:1.75;}
.hero-bullets{list-style:none;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:14px 28px;margin-bottom:40px;}
.hero-bullets li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink-mid);font-weight:500;}
.hero-bullets .hb-check{width:22px;height:22px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;justify-content:center;}
.hero-actions-meta{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:8px;margin-left:4px;}
.hero-actions-meta::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--blue);}

/* Hero demo video composition */
.hero-visual{position:relative;width:100%;max-width:960px;margin:8px auto 0;display:flex;align-items:center;justify-content:center;}
.hero-video{position:relative;z-index:2;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--ink);box-shadow:0 30px 60px rgba(28,24,20,0.18),0 8px 18px rgba(28,24,20,0.08);border:1px solid var(--border);}
.hero-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
.hero-visual-glow{position:absolute;inset:-8% -6% -12% -6%;background:radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.18) 0%, rgba(59,130,246,0.05) 45%, transparent 70%);z-index:1;pointer-events:none;}
.hero-tablet-badge{position:absolute;top:2%;left:-2%;z-index:3;width:156px;height:156px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;box-shadow:0 18px 40px rgba(28,24,20,0.25);transform:rotate(-6deg);}
.hero-tablet-badge sup{font-size:11px;font-weight:500;opacity:.6;margin-left:1px;}
.hero-tablet-badge::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(255,255,255,0.15);}
.hero-badge-asterisk{font-size:11px;color:var(--ink-muted);margin-top:14px;padding-left:4px;font-style:italic;}

/* Stat strip */
.hero-stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:0;}
.hero-stats-strip .stat-cell{padding:28px 28px;border-right:1px solid var(--border);}
.hero-stats-strip .stat-cell:last-child{border-right:none;}
.hero-stats-strip .stat-num{font-family:'Playfair Display',serif;font-size:40px;font-weight:600;color:var(--navy);line-height:1;letter-spacing:-.02em;}
.hero-stats-strip .stat-label{font-size:13px;color:var(--ink-muted);margin-top:8px;line-height:1.5;}
@media(max-width:900px){
  .hero-top{grid-template-columns:1fr;gap:48px;padding:16px 0 48px;}
  .hero-visual{min-height:auto;}
  .hero-tablet-badge{width:120px;height:120px;font-size:15px;padding:14px;left:0;top:-6%;}
  .hero-stats-strip{grid-template-columns:1fr 1fr;}
  .hero-stats-strip .stat-cell:nth-child(2){border-right:none;}
  .hero-stats-strip .stat-cell:nth-child(3){grid-column:1/-1;}
  .hero-stats-strip .stat-cell:nth-child(1),.hero-stats-strip .stat-cell:nth-child(2){border-bottom:1px solid var(--border);}
}
.btn-dark{background:var(--blue);color:#fff;border:none;padding:15px 28px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.01em;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-dark:hover{background:var(--blue-dark);transform:translateY(-2px);}
/* Every "start now" button carries the trial as a second line inside itself —
   the 30-day trial is the objection-killer, so it travels with the ask rather
   than sitting in fine print underneath the section. */
.btn-dark.btn-stacked{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.25;padding:11px 28px;text-align:center;}
.btn-stacked .btn-sub{font-size:11.5px;font-weight:500;letter-spacing:.02em;opacity:.72;}
/* Secondary CTA — pairs with .btn-dark everywhere the page asks for the sale.
   Blue always means "start now"; the demo is deliberately the quieter option. */
.btn-secondary{background:transparent;color:var(--navy);border:1.5px solid var(--cream-dark);padding:13.5px 26px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-secondary:hover{border-color:var(--navy);background:var(--white);transform:translateY(-2px);}
.cta-pair{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;justify-content:center;}
.cta-pair.left{justify-content:flex-start;}
.cta-pair>a,.hero-actions>a{display:inline-flex;align-items:center;justify-content:center;}
.cta-pair>span{align-self:center;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--border);padding:14px 24px;border-radius:6px;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-outline:hover{border-color:var(--ink-muted);}
.hero-aside{padding-bottom:8px;}
.hero-aside-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px;}
.hero-stat-row{padding:18px 0;border-bottom:1px solid var(--border-mid);}
.hero-stat-row:last-child{border-bottom:none;}
.hero-stat-num{font-family:'Playfair Display',serif;font-size:38px;font-weight:600;color:var(--navy);line-height:1;}
.hero-stat-label{font-size:13px;color:var(--ink-muted);margin-top:4px;}

/* Ticker */
.hero-ticker{padding:22px 0;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--border);}
.hero-ticker-inner{display:inline-flex;animation:ticker 32s linear infinite;}
@keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.hero-ticker-item{display:inline-flex;align-items:center;gap:12px;padding:0 32px;font-size:13px;color:var(--ink-muted);font-weight:500;}
.hero-ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0;}

/* Tablet mockup */
.tablet-wrap{position:relative;width:100%;}
.tablet{background:var(--navy);border-radius:18px;padding:14px;box-shadow:0 32px 72px rgba(28,24,20,0.22);border:2px solid rgba(255,255,255,0.08);}
.tablet-screen{background:#fff;border-radius:10px;overflow:hidden;}
.tablet-chrome{background:var(--cream-mid);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.tablet-dots{display:flex;gap:5px;}
.tablet-dot{width:8px;height:8px;border-radius:50%;}
.tablet-url{flex:1;background:var(--white);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:10px;color:var(--ink-muted);text-align:center;font-family:'DM Sans',sans-serif;}
.tablet-home{padding:20px;}
.app-header{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:8px;padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.app-logo{font-family:'Playfair Display',serif;font-size:16px;color:#fff;font-weight:600;}
.app-logo span{color:var(--blue);}
.app-dealer{font-size:10px;color:rgba(255,255,255,0.5);font-family:'DM Sans',sans-serif;}
.app-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;font-family:'DM Sans',sans-serif;}
.app-proposal-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:8px;background:#fff;}
.app-proposal-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.app-proposal-title{font-size:12px;font-weight:600;color:var(--ink);font-family:'DM Sans',sans-serif;}
.app-proposal-sub{font-size:10px;color:var(--ink-muted);font-family:'DM Sans',sans-serif;}
.app-proposal-price{margin-left:auto;font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:var(--navy);}
.app-status{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;font-family:'DM Sans',sans-serif;}
.status-signed{background:#d1fae5;color:#065f46;}
.status-pending{background:#fef3c7;color:#92400e;}
.app-bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.app-metric{background:var(--cream-mid);border-radius:7px;padding:12px;text-align:center;}
.app-metric-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--navy);line-height:1;}
.app-metric-label{font-size:10px;color:var(--ink-muted);margin-top:3px;font-family:'DM Sans',sans-serif;}
.tablet-badge{position:absolute;top:-16px;right:-16px;background:var(--blue);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.15);white-space:nowrap;}

/* SHARED */
.section{padding:110px 32px;}
.section-inner{max-width:1180px;margin:0 auto;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:'';display:block;width:20px;height:1.5px;background:var(--blue);}
.section-title{font-size:clamp(30px,3.8vw,50px);font-weight:600;color:var(--ink);margin-bottom:20px;letter-spacing:-.02em;}
.section-sub{font-size:16.5px;color:var(--ink-muted);max-width:540px;line-height:1.8;}

/* TRUST */
.trust{background:var(--white);padding:52px 32px;border-bottom:1px solid var(--border);}
.trust-inner{max-width:1180px;margin:0 auto;}
.trust-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:24px;}
.trust-logos{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:nowrap;width:100%;}
.trust-logo{display:flex;align-items:center;justify-content:center;height:32px;flex:0 1 auto;min-width:0;filter:grayscale(100%);opacity:0.45;transition:opacity .25s ease, filter .25s ease;}
.trust-logo img{max-height:100%;max-width:100%;width:auto;height:auto;display:block;object-fit:contain;}
.trust-logo:hover{opacity:1;filter:grayscale(0%);}
.trust-logo.is-circle{height:40px;}
@media (max-width: 900px){
  .trust-logos{flex-wrap:wrap;justify-content:center;gap:24px 32px;}
  .trust-logo{height:28px;}
  .trust-logo.is-circle{height:36px;}
}

/* WAYS TO SELL — the two motions the same proposal engine runs */
.ways-section{background:var(--white);padding:110px 32px;}
.ways-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:64px;padding-bottom:56px;border-bottom:1px solid var(--border);}
.ways-stat{display:flex;align-items:baseline;gap:20px;margin-top:30px;padding-top:26px;border-top:1px solid var(--border);}
.ways-stat-num{font-family:'Playfair Display',serif;font-size:clamp(48px,6vw,74px);font-weight:700;color:var(--navy);line-height:.88;letter-spacing:-.04em;flex-shrink:0;}
.ways-stat-label{font-size:14px;color:var(--ink-muted);line-height:1.65;max-width:300px;}
.ways-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);background:var(--white);}
.way-card{display:flex;flex-direction:column;border-right:1px solid var(--border);transition:background .2s;}
.way-card:last-child{border-right:none;}
.way-card:hover{background:var(--cream);}
.way-media{position:relative;height:358px;overflow:hidden;border-bottom:1px solid var(--border);background:var(--cream-mid);}
.way-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.22,.61,.36,1);}
.way-card:hover .way-media img{transform:scale(1.035);}
.way-media.is-render{background:linear-gradient(180deg,var(--white) 0%,var(--cream-mid) 100%);}
.way-media.is-render img{object-fit:contain;object-position:center;padding:14px 8px 48px;}
.way-media-caption{position:absolute;left:18px;bottom:18px;right:18px;display:flex;align-items:center;gap:10px;background:rgba(255,255,254,0.94);backdrop-filter:blur(6px);padding:10px 14px;border-radius:6px;font-size:12px;color:var(--ink-mid);font-weight:500;box-shadow:0 4px 16px rgba(28,24,20,0.12);}
.way-media-caption .pc-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 0 3px rgba(59,130,246,0.18);}
.way-body{padding:38px 40px 40px;display:flex;flex-direction:column;flex:1;}
.way-ico{width:46px;height:46px;border-radius:11px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
.way-title{font-family:'Playfair Display',serif;font-size:25px;font-weight:600;color:var(--ink);margin-bottom:14px;letter-spacing:-.015em;line-height:1.2;}
.way-desc{font-size:15px;color:var(--ink-muted);line-height:1.8;}
.way-points{list-style:none;margin-top:26px;display:flex;flex-direction:column;flex:1;}
.way-points li{display:flex;align-items:flex-start;gap:13px;padding:15px 0;border-bottom:1px solid var(--border);font-size:14.5px;color:var(--ink-mid);line-height:1.6;}
.way-points li:first-child{border-top:1px solid var(--border);}
.way-points li:last-child{border-bottom:none;}
.way-check{color:var(--blue);font-weight:700;flex-shrink:0;margin-top:1px;}
.way-tag{align-self:flex-start;margin-top:26px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:4px;background:var(--blue-light);color:var(--blue-dark);}

/* FEATURES */
.features-section{padding:110px 32px;}
.features-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:72px;padding-bottom:56px;border-bottom:1px solid var(--border);}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--border);}
.feat-card{padding:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .2s;cursor:default;position:relative;overflow:hidden;}
.feat-card:hover{background:var(--white);}
.feat-card:nth-child(3n){border-right:none;}
.feat-card:nth-last-child(-n+3){border-bottom:none;}
.feat-body{padding:28px 36px 36px;}
.feat-graphic{height:196px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-mid);background:linear-gradient(180deg, transparent 0%, rgba(28,24,20,0.012) 100%);overflow:hidden;}
.feat-graphic svg{display:block;height:100%;width:auto;max-width:100%;}
.feat-card:hover .feat-graphic{background:linear-gradient(180deg, rgba(59,130,246,0.025) 0%, rgba(59,130,246,0.01) 100%);}

/* product-screenshot cards — alternate with the drawn graphics in a checkerboard */
.feat-graphic.is-shot{background:#fff;padding:0;}
.feat-card:hover .feat-graphic.is-shot{background:#fff;}
.feat-graphic.is-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;transform:scale(1.005);transition:transform .5s cubic-bezier(.22,.61,.36,1);}
.feat-card:hover .feat-graphic.is-shot img{transform:scale(1.035);}
@media (prefers-reduced-motion: reduce){
  .feat-graphic.is-shot img,.feat-card:hover .feat-graphic.is-shot img{transition:none;transform:none;}
}
/* single-column: let the shots keep their 2:1 ratio instead of cropping the UI off the sides */
@media (max-width:768px){
  .feat-graphic.is-shot{height:auto;aspect-ratio:2/1;}
}

/* shared graphic animations */
@keyframes fg-draw{from{stroke-dashoffset:var(--len,200);}to{stroke-dashoffset:0;}}
@keyframes fg-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes fg-pulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:.9;transform:scale(1.08);}}
@keyframes fg-fadein{0%{opacity:0;}100%{opacity:1;}}
@keyframes fg-slideup{0%{opacity:0;transform:translateY(8px);}30%,70%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-4px);}}
@keyframes fg-countup{0%{opacity:0;}20%,100%{opacity:1;}}
@keyframes fg-sweep{0%{transform:rotate(-60deg);}50%{transform:rotate(60deg);}100%{transform:rotate(-60deg);}}
@keyframes fg-ring{0%{r:8;opacity:.8;}100%{r:32;opacity:0;}}
@keyframes fg-tick{0%,45%{transform:translateY(0);}50%,55%{transform:translateY(-1px);}60%,100%{transform:translateY(0);}}
@keyframes fg-barup{0%{transform:scaleY(.2);}100%{transform:scaleY(1);}}
@keyframes fg-shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(200%);}}
@keyframes fg-dash{to{stroke-dashoffset:-24;}}
@keyframes fg-needle{0%,100%{transform:rotate(-62deg);}50%{transform:rotate(44deg);}}
@keyframes fg-flip{0%,100%{transform:perspective(400px) rotateY(0deg);}50%{transform:perspective(400px) rotateY(-180deg);}}
@keyframes fg-drip{0%{transform:translateY(-8px);opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{transform:translateY(28px);opacity:0;}}

.feat-num{font-family:'Playfair Display',serif;font-size:13px;color:var(--ink-muted);margin-bottom:16px;letter-spacing:.06em;}
.feat-title{font-size:17px;font-weight:600;font-family:'Playfair Display',serif;color:var(--ink);margin-bottom:10px;}
.feat-desc{font-size:14px;color:var(--ink-muted);line-height:1.75;}
.feat-tag{display:inline-block;margin-top:14px;font-size:10.5px;font-weight:700;color:var(--blue-dark);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;background:var(--blue-light);border-radius:4px;color:var(--blue-dark);}

/* FLOW — how a deal works */
.flow-section{background:var(--navy);padding:110px 32px;}
.flow-inner{max-width:1180px;margin:0 auto;}
.flow-eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.flow-eyebrow::before{content:'';display:block;width:20px;height:1.5px;background:var(--blue);}
.flow-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:64px;padding-bottom:56px;border-bottom:1px solid rgba(255,255,255,0.08);}
.flow-title{font-size:clamp(30px,3.8vw,50px);font-weight:600;color:#fff;letter-spacing:-.02em;}
.flow-title em{font-style:italic;opacity:.55;}
.flow-sub{font-size:16px;color:rgba(255,255,255,0.5);line-height:1.8;}
.flow-video{position:relative;width:100%;max-width:960px;margin:0 auto;aspect-ratio:16/9;border:1px solid rgba(255,255,255,0.08);background:#000;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,0.45);}
.flow-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
.flow-caption{margin-top:18px;text-align:center;font-size:13px;color:rgba(255,255,255,0.35);}

/* COMPARISON */
.compare-section{background:var(--white);padding:110px 32px;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:64px;border:1px solid var(--border);}
.compare-col{padding:0;}
.compare-col-header{padding:24px 36px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.compare-col-header.old{background:var(--cream-mid);}
.compare-col-header.new{background:var(--navy);}
.compare-col-header.new .compare-label{color:#fff;}
.compare-col-header.new .compare-sub{color:rgba(255,255,255,0.5);}
.compare-label{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--ink);}
.compare-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.compare-divider{width:1px;background:var(--border);}
.compare-row{display:flex;align-items:flex-start;gap:12px;padding:20px 36px;border-bottom:1px solid var(--border);font-size:14px;color:var(--ink-mid);line-height:1.6;}
.compare-row:last-child{border-bottom:none;}
.compare-icon{flex-shrink:0;margin-top:2px;font-size:15px;width:20px;text-align:center;}

/* PRICING */
.pricing-section{background:var(--cream-mid);padding:110px 32px;border-top:1px solid var(--border);}
.pricing-inner{max-width:940px;margin:0 auto;}
.pricing-head{text-align:center;margin-bottom:34px;}
.pricing-head .eyebrow{justify-content:center;}
.pricing-head .section-title{margin-bottom:16px;}
.pricing-sub{font-size:16px;color:var(--ink-muted);max-width:580px;margin:0 auto;line-height:1.75;}
.pricing-sub strong{color:var(--ink);font-weight:600;}

/* Billing interval toggle */
.pr-toggle-wrap{display:flex;justify-content:center;margin-bottom:30px;}
.pr-toggle{display:inline-flex;background:var(--white);border:1px solid var(--border);border-radius:11px;padding:4px;gap:4px;}
.pr-opt{border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink-muted);padding:9px 18px;border-radius:8px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.pr-opt:hover{color:var(--ink);}
.pr-opt[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 1px 6px rgba(28,24,20,.14);}
.pr-save{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(22,163,74,.13);color:#16a34a;padding:2.5px 8px;border-radius:20px;}
.pr-opt[aria-pressed="true"] .pr-save{background:#16a34a;color:#fff;}

/* Free-trial promo bar — between the interval toggle and the plan grid.
   'reveal' has to stay on the static outer wrapper: the IntersectionObserver
   adds .visible straight to the node, and React wipes it on any re-render that
   rewrites className — so the toggle-dependent class goes on the inner div. */
.pr-promo-wrap{margin:-4px 0 26px;}
.pr-promo{display:flex;align-items:center;justify-content:center;gap:11px;max-width:660px;margin:0 auto;padding:13px 20px;border-radius:11px;font-size:13.5px;line-height:1.55;background:rgba(22,163,74,.09);border:1px solid rgba(22,163,74,.26);color:var(--ink-mid);}
.pr-promo strong{color:#15803d;font-weight:700;}
.pr-promo svg{flex:none;color:#16a34a;}
.pr-promo.muted{background:var(--white);border-color:var(--border-mid);}
.pr-promo.muted svg{color:var(--ink-muted);}
.pr-promo.muted strong{color:var(--ink);}
@media(max-width:768px){.pr-promo{font-size:12.5px;padding:12px 15px;align-items:flex-start;}}

/* Plan cards — equal height so the featured card never reads as the smaller one */
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;}
.pr-card{position:relative;display:flex;flex-direction:column;background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:30px 28px 28px;transition:border-color .2s,box-shadow .2s,transform .2s;}
.pr-card:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(28,24,20,.07);}
.pr-card.featured{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.09);}
.pr-card.featured:hover{box-shadow:0 0 0 3px rgba(59,130,246,.09),0 12px 34px rgba(28,24,20,.09);}
.pr-ribbon{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:5px 14px;border-radius:20px;white-space:nowrap;}
.pr-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:5px;}
.pr-for{font-size:13px;color:var(--ink-muted);line-height:1.55;min-height:40px;}
.pr-price{display:flex;align-items:baseline;gap:7px;margin-top:20px;}
/* line-height 1 clips the top of Playfair's '$' glyph */
.pr-amt{font-family:'Playfair Display',serif;font-size:46px;font-weight:600;color:var(--navy);line-height:1.08;letter-spacing:-.025em;}
.pr-per{font-size:14.5px;color:var(--ink-muted);font-weight:500;}
.pr-note{font-size:12.5px;color:var(--ink-muted);margin-top:8px;min-height:18px;}
.pr-note-save{color:#16a34a;font-weight:600;}
.pr-btn{width:100%;margin-top:22px;border-radius:8px;padding:15px 20px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.pr-btn.solid{background:var(--blue);color:#fff;border:1.5px solid var(--blue);}
.pr-btn.solid:hover{background:var(--blue-dark);border-color:var(--blue-dark);transform:translateY(-2px);}
.pr-btn.outline{background:transparent;color:var(--navy);border:1.5px solid var(--cream-dark);}
.pr-btn.outline:hover{border-color:var(--navy);background:var(--cream);transform:translateY(-2px);}
.pr-btn-note{font-size:11.5px;color:var(--ink-muted);text-align:center;margin-top:9px;}
.pr-btn:disabled{cursor:default;}
.pr-btn:disabled:not(.loading){opacity:.5;}
.pr-btn:disabled:hover{transform:none;}
.pr-btn-spinner{display:none;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:pr-spin .7s linear infinite;}
.pr-btn.outline .pr-btn-spinner{border-color:rgba(26,39,68,.25);border-top-color:var(--navy);}
.pr-btn.loading .pr-btn-spinner{display:block;}
.pr-btn.loading .pr-btn-text{display:none;}
@keyframes pr-spin{to{transform:rotate(360deg);}}
.pr-alt{text-align:center;font-size:14px;color:var(--ink-muted);margin-top:26px;line-height:1.7;}
.pr-alt a{color:var(--blue);font-weight:600;border-bottom:1px solid rgba(59,130,246,.3);}
.pr-alt a:hover{border-bottom-color:var(--blue);}
.pr-divider{height:1px;background:var(--border-mid);margin-top:24px;}
.pr-features{list-style:none;display:flex;flex-direction:column;gap:10px;padding-top:20px;flex:1;}
.pr-features li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink-mid);line-height:1.5;}
.pr-lead{font-weight:600;color:var(--ink);}
.pr-feat-head{font-size:11px !important;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted) !important;margin-bottom:-2px;}
.pr-feat-head.divided{margin-top:8px;padding-top:16px;border-top:1px solid var(--border-mid);}
.pr-ico{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.pr-ico svg{width:9px;height:9px;fill:none;stroke-width:2.5;}
.pr-ico.yes{background:#f0fdf4;}
.pr-ico.yes svg{stroke:#16a34a;}
.pr-ico.plus{background:var(--blue-light);}
.pr-ico.plus svg{stroke:var(--blue);}
.pr-ico.lim{background:var(--cream-mid);}
.pr-ico.lim svg{stroke:var(--ink-muted);}

.pr-trust{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:26px;flex-wrap:wrap;}
.pr-trust-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-muted);}

/* Usage estimator */
.pr-est{margin-top:26px;background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:30px 28px;}
.pr-est-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.pr-est-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.pr-est-sub{font-size:13.5px;color:var(--ink-muted);line-height:1.7;margin-bottom:26px;max-width:640px;}
.pr-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--cream-mid);outline:none;cursor:pointer;margin-bottom:12px;}
.pr-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;box-shadow:0 2px 8px rgba(59,130,246,.35);transition:transform .15s;}
.pr-slider::-webkit-slider-thumb:hover{transform:scale(1.15);}
.pr-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;border:none;box-shadow:0 2px 8px rgba(59,130,246,.35);}
.pr-slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted);margin-bottom:24px;}
.pr-est-result{background:var(--blue-light);border:1px solid rgba(59,130,246,.15);border-radius:10px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.pr-est-vol{font-size:13px;color:var(--blue);font-weight:500;margin-bottom:2px;}
.pr-est-tier{font-size:12px;color:var(--ink-muted);}
.pr-est-right{text-align:right;}
.pr-est-cost{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--navy);line-height:1;}
.pr-est-cost-label{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}
.pr-foot{margin-top:22px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-muted);line-height:1.7;}
.pr-foot svg{flex-shrink:0;margin-top:3px;}

@media(max-width:760px){.pr-grid{grid-template-columns:1fr;gap:16px;}}
/* Matches the section padding shared mobile.css applies to the neighbouring sections */
@media(max-width:768px){.pricing-section{padding:64px 20px;}}
@media(max-width:560px){
  .pr-toggle{width:100%;}
  .pr-opt{flex:1;justify-content:center;padding:10px 12px;}
  .pr-for{min-height:0;}
  .pr-card{padding:28px 20px 24px;}
  .pr-est{padding:24px 20px;}
  .pr-est-result{flex-direction:column;align-items:flex-start;gap:12px;}
  .pr-est-right{text-align:left;}
}

/* FAQ */
.faq-section{padding:110px 32px;}
.faq-inner{max-width:800px;margin:0 auto;}
.faq-list{margin-top:52px;}
.faq-item{border-bottom:1px solid var(--border);}
.faq-item:first-child{border-top:1px solid var(--border);}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:24px 0;cursor:pointer;gap:24px;}
.faq-q-text{font-size:16px;font-weight:500;color:var(--ink);font-family:'Playfair Display',serif;transition:color .2s;}
.faq-item.open .faq-q-text{color:var(--navy);}
.faq-q:hover .faq-q-text{color:var(--navy);}
.faq-icon{flex-shrink:0;transition:transform .25s;color:var(--ink-muted);}
.faq-item.open .faq-icon{transform:rotate(45deg);}
.faq-a{font-size:15px;color:var(--ink-muted);line-height:1.8;padding-bottom:24px;display:none;}
.faq-item.open .faq-a{display:block;}

/* CTA */
.cta-banner{background:var(--navy);padding:96px 32px;position:relative;overflow:hidden;}
.cta-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(59,130,246,0.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(255,200,80,0.06) 0%,transparent 60%);}
.cta-inner{max-width:1180px;margin:0 auto;position:relative;display:grid;grid-template-columns:1fr 480px;gap:80px;align-items:start;}
.cta-left{}
.cta-right{}
.cta-tag{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:24px;display:flex;align-items:center;gap:10px;}
.cta-tag::before{content:'';display:block;width:20px;height:1px;background:var(--blue);}
.cta-banner h2{font-size:clamp(32px,4.5vw,52px);color:#fff;margin-bottom:18px;letter-spacing:-.025em;}
.cta-banner h2 em{font-style:italic;opacity:.7;}
.cta-banner p{font-size:16px;color:rgba(255,255,255,0.6);margin-bottom:36px;line-height:1.85;}
.cta-checklist{list-style:none;display:flex;flex-direction:column;gap:0;margin-bottom:40px;}
.cta-check-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:14px;color:rgba(255,255,255,0.7);}
.cta-check-item:first-child{border-top:1px solid rgba(255,255,255,0.07);}
.cta-check-icon{width:20px;height:20px;border-radius:50%;background:rgba(59,130,246,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cta-panel{background:var(--white);border-radius:10px;}
.cta-panel > iframe{display:block;width:100%;border:none;min-height:680px;border-bottom-left-radius:10px;border-bottom-right-radius:10px;}
.cta-panel-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;}
.cta-panel-icon{width:38px;height:38px;border-radius:8px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cta-panel-title{font-size:14px;font-weight:700;color:var(--ink);}
.cta-panel-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.cta-trust{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;}
.cta-trust-item{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.45);}
@media(max-width:900px){.cta-inner{grid-template-columns:1fr;gap:48px;}}
.btn-cream{background:var(--cream);color:var(--navy);border:none;padding:15px 30px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-cream:hover{background:#fff;transform:translateY(-2px);}
.btn-ghost{background:transparent;color:rgba(255,255,255,0.7);border:1.5px solid rgba(255,255,255,0.2);padding:14px 28px;border-radius:6px;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-ghost:hover{border-color:rgba(255,255,255,0.5);color:#fff;}

/* BOOKING SECTION */
.booking-section{padding:100px 32px;background:var(--cream);border-top:1px solid var(--border);}
.booking-inner{max-width:960px;margin:0 auto;}
.booking-header{text-align:center;margin-bottom:56px;}
.booking-header .eyebrow{justify-content:center;}
.booking-header h2{font-size:clamp(30px,4vw,48px);font-weight:600;letter-spacing:-.025em;margin-bottom:16px;}
.booking-header h2 em{font-style:italic;color:var(--navy);}
.booking-header p{font-size:16px;color:var(--ink-muted);line-height:1.8;max-width:520px;margin:0 auto;}
.booking-panel{background:var(--white);border:1px solid var(--border);border-radius:10px;}
.booking-panel > iframe{display:block;width:100%;border:none;min-height:680px;border-bottom-left-radius:10px;border-bottom-right-radius:10px;}
.booking-panel-header{padding:24px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;}
.booking-panel-icon{width:42px;height:42px;border-radius:10px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.booking-panel-title{font-size:15px;font-weight:700;color:var(--ink);}
.booking-panel-sub{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
.booking-trust{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:36px;flex-wrap:wrap;}
.booking-trust-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-muted);}
.booking-trust-item svg{color:var(--blue);}

/* FOOTER */
.footer{background:var(--ink);padding:72px 32px 40px;}
.footer-inner{max-width:1180px;margin:0 auto;}
.footer-top{display:grid;grid-template-columns:1.6fr 1fr .9fr 1.2fr;gap:56px;padding-bottom:56px;border-bottom:1px solid rgba(255,255,255,0.08);}
.footer-brand p{font-size:13.5px;color:rgba(255,255,255,0.4);margin-top:20px;line-height:1.75;max-width:260px;}
.footer-brand img{height:30px;}
.footer-col h4{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,0.3);margin-bottom:18px;}
.footer-col a{display:block;font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:11px;transition:color .2s;}
.footer-col a:hover{color:#fff;}
.footer-bottom{padding-top:28px;display:flex;align-items:center;justify-content:space-between;}
.footer-copy{font-size:13px;color:rgba(255,255,255,0.25);}
.footer-disclaimer{max-width:820px;margin:22px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);text-align:center;font-size:11.5px;line-height:1.65;color:rgba(255,255,255,0.35);}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:none;}

@media(max-width:960px){
  .features-header,.flow-header,.ways-header,.ways-grid,.compare-grid,.testi-grid{grid-template-columns:1fr;}
  .features-grid{grid-template-columns:1fr 1fr;}
  .nav-pill{display:none;}
  .footer-top{grid-template-columns:1fr 1fr;gap:32px;}
  .ways-header{gap:28px;}
  .way-card{border-right:none;border-bottom:1px solid var(--border);}
  .way-card:last-child{border-bottom:none;}
  .way-body{padding:32px 26px 34px;}
  .way-media{height:320px;}
  .way-media.is-render img{padding:14px 6px 46px;}
  .compare-divider{display:none;}
  .cta-banner{padding:72px 20px;}
  .section{padding-left:20px;padding-right:20px;}
  .hero-top{padding:80px 20px 48px;}
}
@media(max-width:600px){
  .way-media{height:238px;}
  .way-media.is-render img{padding:12px 6px 40px;}
  .hero-top h1,.hero h1{font-size:clamp(34px,9vw,52px);}
  .hero-actions{flex-direction:column;align-items:stretch;}
  .hero-actions .btn-dark,.hero-actions .btn-outline,.hero-actions a{width:100%;text-align:center;justify-content:center;}
  .features-grid{grid-template-columns:1fr;}

    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

// Plan pricing and per-asset rates mirror /sales/checkout-v2 — keep the two
// in sync when either changes.
const PRICING_PLANS = {
  starter: {month:97,  year:997},
  pro:     {month:297, year:2997},
};
const USAGE_TIERS = [
  {vol:'100',    label:'Up to 100 proposals', rate:3.50},
  {vol:'250',    label:'Up to 250 proposals', rate:2.75},
  {vol:'750',    label:'Up to 750 proposals', rate:2.13},
  {vol:'1,500+', label:'1,500+ proposals',    rate:1.88},
];

function PrIco({kind}) {
  return (
    <span className={`pr-ico ${kind}`}>
      {kind === 'plus'
        ? <svg viewBox="0 0 9 9"><path d="M4.5 1.5v6M1.5 4.5h6"/></svg>
        : <svg viewBox="0 0 9 9"><polyline points="1.5,4.5 3.5,6.5 7.5,2"/></svg>}
    </span>
  );
}

function Pricing() {
  const [billing, setBilling] = useState('month');
  const [volIdx, setVolIdx] = useState(1);
  const [pending, setPending] = useState(null);

  const isYear = billing === 'year';
  const money = n => '$' + n.toLocaleString('en-US');
  const amountFor = key => isYear ? PRICING_PLANS[key].year : PRICING_PLANS[key].month;

  // Same call /sales/checkout-v2 makes. The page only sends tier and interval —
  // /api/checkout resolves the real Stripe price and attaches the trial, so the
  // buy box here can never drift out of sync with that page's pricing.
  const startCheckout = async key => {
    if (pending) return;
    setPending(key);
    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({service: 'sales', plan: key, interval: billing}),
      });
      const {url, error} = await res.json();
      if (error || !url) throw new Error(error || 'No checkout URL returned');
      window.location.href = url;
    } catch (err) {
      alert('Something went wrong starting checkout. Please try again, or contact us at Info@TreatEngine.com');
      setPending(null);
    }
  };

  // Trial language is monthly-only — annual bills up front, so the button and
  // the line under it must never promise a free trial while isYear.
  const ctaFor = name => isYear ? ('Get ' + name + ' →') : 'Start 30-day free trial →';
  const billedFor = key => {
    const amt = money(amountFor(key));
    return isYear
      ? amt + ' due today, then ' + amt + '/year'
      : '$0 due today — free for 30 days, then ' + amt + '/month';
  };

  const noteFor = key => {
    // The 30-day trial is monthly-only, matching /sales/checkout-v2 — annual
    // bills up front, so nothing here may promise a trial while isYear.
    if(!isYear) return (
      <><span className="pr-note-save">First 30 days free</span> · then billed monthly</>
    );
    const perMonth = Math.round(PRICING_PLANS[key].year / 12);
    const saved = PRICING_PLANS[key].month * 12 - PRICING_PLANS[key].year;
    return (
      <>{money(perMonth)}/mo billed annually · <span className="pr-note-save">save {money(saved)}</span></>
    );
  };

  const tier = USAGE_TIERS[volIdx];
  const pct = (volIdx / (USAGE_TIERS.length - 1)) * 100;

  const starterFeatures = [
    {kind:'head', text:"What's included"},
    {kind:'yes',  text:<><span className="pr-lead">Residential</span> sales flow</>},
    {kind:'lim',  text:<><span className="pr-lead">1</span> office</>},
    {kind:'lim',  text:<>Up to <span className="pr-lead">5</span> users</>},
    {kind:'yes',  text:'Unlimited products'},
    {kind:'yes',  text:'Financing & Stripe integrations'},
    {kind:'yes',  text:'Unlimited pitch recordings & AI coaching'},
    {kind:'yes',  text:'Dedicated account manager'},
  ];
  const proFeatures = [
    {kind:'head', text:'Everything in Starter, plus'},
    {kind:'plus', text:<><span className="pr-lead">Unlimited</span> users</>},
    {kind:'plus', text:<><span className="pr-lead">Unlimited</span> offices</>},
    {kind:'plus', text:<><span className="pr-lead">Commercial</span> sales flow</>},
    {kind:'plus', text:<><span className="pr-lead">Rentals</span> catalog</>},
  ];

  const renderFeatures = feats => (
    <ul className="pr-features">
      {feats.map((f,i) => {
        if(f.kind === 'head' || f.kind === 'head-divided') {
          return <li className={`pr-feat-head${f.kind === 'head-divided' ? ' divided' : ''}`} key={i}>{f.text}</li>;
        }
        return <li key={i}><PrIco kind={f.kind}/><span>{f.text}</span></li>;
      })}
    </ul>
  );

  const plans = [
    {
      key:'starter',
      name:'Starter',
      blurb:'For residential dealers running a single office with a small team.',
      featured:false,
      features:starterFeatures,
    },
    {
      key:'pro',
      name:'Pro',
      blurb:'For dealers running multiple offices, or selling commercial and rentals.',
      featured:true,
      features:proFeatures,
    },
  ];

  return (
    <section className="pricing-section" id="pricing">
      <div className="pricing-inner">
        <div className="pricing-head reveal">
          <div className="eyebrow">Pricing</div>
          <h2 className="section-title">Dealer pricing,<br/><em style={{fontStyle:'italic',color:'var(--navy)'}}>with nothing hidden.</em></h2>
          <p className="pricing-sub">Setup, catalog build, customization and team training are <strong>included free</strong> on both plans. Monthly plans start with a <strong>30-day free trial</strong> — no contracts, cancel anytime.</p>
        </div>

        <div className="pr-toggle-wrap reveal">
          <div className="pr-toggle" role="group" aria-label="Billing interval">
            <button type="button" className="pr-opt" aria-pressed={!isYear} onClick={() => setBilling('month')}>Monthly</button>
            <button type="button" className="pr-opt" aria-pressed={isYear} onClick={() => setBilling('year')}>
              Annual <span className="pr-save">Save 16%</span>
            </button>
          </div>
        </div>

        <div className="pr-promo-wrap reveal">
          <div className={isYear ? 'pr-promo muted' : 'pr-promo'}>
            <svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="7" cy="7" r="6"/><polyline points="5,7 7,9 10,5"/></svg>
            {isYear
              ? <span>The <strong>30-day free trial</strong> runs on monthly billing — switch to Monthly to start free, then move to annual whenever you like.</span>
              : <span><strong>30-day free trial on both plans.</strong> Run Starter or Pro free for 30 days — cancel before day 30 and you’re never charged.</span>}
          </div>
        </div>

        <div className="pr-grid reveal">
          {plans.map(p => (
            <div className={`pr-card${p.featured ? ' featured' : ''}`} key={p.key}>
              {p.featured && <span className="pr-ribbon">Most popular</span>}
              <div className="pr-name">{p.name}</div>
              <div className="pr-for">{p.blurb}</div>

              <div className="pr-price">
                <span className="pr-amt">{money(amountFor(p.key))}</span>
                <span className="pr-per">{isYear ? '/ year' : '/ month'}</span>
              </div>
              <div className="pr-note">{noteFor(p.key)}</div>

              <button
                type="button"
                className={`pr-btn ${p.featured ? 'solid' : 'outline'}${pending === p.key ? ' loading' : ''}`}
                disabled={pending !== null}
                onClick={() => startCheckout(p.key)}
              >
                <span className="pr-btn-text">{ctaFor(p.name)}</span>
                <span className="pr-btn-spinner" aria-hidden="true"></span>
              </button>
              <div className="pr-btn-note">{billedFor(p.key)}</div>

              <div className="pr-divider"></div>
              {renderFeatures(p.features)}
            </div>
          ))}
        </div>

        <div className="pr-alt reveal">
          Want to see it run first? <a href="#book">Request a 30-minute demo</a> — we'll build a proposal with your catalog and your pricing, then send you the link so you can read it the way your customers will.
        </div>

        <div className="pr-trust reveal">
          {!isYear && (
            <div className="pr-trust-item">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="7" cy="7" r="6"/><polyline points="5,7 7,9 10,5"/></svg>
              30-day free trial
            </div>
          )}
          <div className="pr-trust-item">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="7" cy="7" r="6"/><polyline points="5,7 7,9 10,5"/></svg>
            No setup fee
          </div>
          <div className="pr-trust-item">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="7" cy="7" r="6"/><polyline points="5,7 7,9 10,5"/></svg>
            No contracts
          </div>
        </div>

        <div className="pr-est reveal">
          <div className="pr-est-label">Usage estimator</div>
          <div className="pr-est-title">What's your monthly proposal volume?</div>
          <div className="pr-est-sub">Every proposal you generate — each presentation and each contract — is billed per asset, at the same rates on both plans. Move the slider to your expected volume — higher volume earns a lower per-asset rate, billed automatically at month's end.</div>

          <input
            type="range"
            className="pr-slider"
            min="0" max={USAGE_TIERS.length - 1} step="1"
            value={volIdx}
            onChange={e => setVolIdx(parseInt(e.target.value, 10))}
            aria-label="Monthly proposal volume"
            style={{background:`linear-gradient(to right, var(--blue) ${pct}%, var(--cream-mid) ${pct}%)`}}
          />
          <div className="pr-slider-labels">
            {USAGE_TIERS.map(t => <span key={t.vol}>{t.vol}</span>)}
          </div>

          <div className="pr-est-result">
            <div>
              <div className="pr-est-vol">{tier.vol} proposals / month</div>
              <div className="pr-est-tier">{tier.label}</div>
            </div>
            <div className="pr-est-right">
              <div className="pr-est-cost">${tier.rate.toFixed(2)}</div>
              <div className="pr-est-cost-label">per asset generated</div>
            </div>
          </div>
        </div>

        <div className="pr-foot reveal">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--ink-muted)" strokeWidth="1.5"><circle cx="7" cy="7" r="6"/><path d="M7 5v3"/><circle cx="7" cy="9.5" r=".5" fill="var(--ink-muted)"/></svg>
          <span>Usage — every asset generated across your dealership — is tracked and invoiced automatically at month-end. You can upgrade, downgrade, or cancel at any time.</span>
        </div>
      </div>
    </section>
  );
}

function TweaksPanel({tweaks, setTweaks, visible}) {
  if(!visible) return null;
  const update = (k,v) => {
    const next = {...tweaks,[k]:v};
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
  };
  const fs = {width:'100%',padding:'8px 10px',border:'1px solid var(--border)',borderRadius:6,fontSize:13,fontFamily:'DM Sans,sans-serif',background:'var(--cream)',color:'var(--ink)',resize:'none'};
  const ls = {fontSize:11,fontWeight:600,color:'var(--ink-muted)',marginBottom:6,display:'block',textTransform:'uppercase',letterSpacing:'0.08em'};
  return (
    <div style={{position:'fixed',bottom:24,right:24,background:'var(--white)',borderRadius:12,boxShadow:'0 8px 40px rgba(28,24,20,0.12)',padding:24,width:300,zIndex:9999,border:'1px solid var(--border)',fontFamily:'DM Sans,sans-serif'}}>
      <div style={{fontSize:12,fontWeight:700,color:'var(--ink-muted)',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--border)'}}>Tweaks</div>
      <div style={{marginBottom:14}}>
        <label style={ls}>Hero Headline</label>
        <textarea value={tweaks.heroHeadline} onChange={e=>update('heroHeadline',e.target.value)} rows={2} style={fs}/>
      </div>
      <div style={{marginBottom:14}}>
        <label style={ls}>Primary CTA text</label>
        <input value={tweaks.ctaText} onChange={e=>update('ctaText',e.target.value)} style={fs}/>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:14,borderTop:'1px solid var(--border)'}}>
        <label style={{...ls,margin:0}}>Show comparison table</label>
        <input type="checkbox" checked={tweaks.showComparison} onChange={e=>update('showComparison',e.target.checked)} style={{width:16,height:16,accentColor:'var(--navy)'}}/>
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  useReveal();
  useEffect(() => {
    const h = e => {
      if(e.data?.type==='__activate_edit_mode') setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', h);
  }, []);
  return (
    <>
      <Nav tweaks={tweaks}/>
      <Hero tweaks={tweaks}/>
      <Trust/>
      <Ways/>
      <Features/>
      <DealFlow/>
      <Comparison tweaks={tweaks}/>
      <Pricing/>
      <FAQ/>
      <CTABanner tweaks={tweaks}/>
      <Footer/>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    s.src = 'https://link.msgsndr.com/js/form_embed.js';
    s.type = 'text/javascript';
    document.body.appendChild(s);
  });
});
</script>
